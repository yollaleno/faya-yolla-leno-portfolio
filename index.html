/* ==========================================================================
   ENHANCED STYLES FOR ETHAN.D REPRODUCTION (PART 2)
   Modals, Lightboxes, Testimonials, Publication Details, Style Guide
   ========================================================================== */

/* ---------- Modals & Lightbox Overlays ---------- */
.modal-backdrop, .lightbox-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 12, 16, 0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-backdrop.open, .lightbox-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-dialog {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 780px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  position: relative;
  padding: clamp(1.8rem, 4vw, 2.8rem);
  box-shadow: 0 35px 90px rgba(0, 0, 0, 0.65);
  transform: translateY(24px) scale(0.97);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-backdrop.open .modal-dialog {
  transform: translateY(0) scale(1);
}

        color: var(--ink);
        padding: .85rem 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line)
      }

      .nav a:hover {
        background: none
      }

      .nav a[aria-current="page"]::after {
        left: auto;
        right: 0;
        top: 50%;
        bottom: auto;
        margin-top: -4px;
        width: 8px;
        height: 8px
      }
    }

    @media (max-width:420px) {
      .seg button {
        padding: .3rem .5rem
      }
    }

    /* ---------- buttons, chips ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      padding: .92rem 1.5rem;
      border-radius: 999px;
      font-weight: 650;
      font-size: 1rem;
      text-decoration: none;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform .35s var(--ease), background-color .25s, color .25s, border-color .25s, box-shadow .35s var(--ease);
      white-space: nowrap
    }

    .btn .ico {
      width: 18px;
      height: 18px;
      transition: transform .35s var(--ease)
    }

    .btn:hover .ico {
      transform: translateX(3px)
    }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent)
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--accent) 70%, transparent)
    }

    .btn-dark {
      background: var(--ink);
      color: var(--bg)
    }

    .btn-dark:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-s)
    }

    .btn-outline {
      border-color: var(--line-2);
      color: var(--ink);
      background: transparent
    }

    .btn-outline:hover {
      border-color: var(--ink);
      transform: translateY(-2px)
    }

    .btn-s {
      padding: .6rem 1.05rem;
      font-size: .9rem
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .8rem;
      font-weight: 650;
      padding: .32rem .72rem;
      border-radius: 999px;
      background: var(--bg-2);
      color: var(--ink-2);
      border: 1px solid var(--line);
      white-space: nowrap
    }

    .chip.acc {
      background: var(--accent-soft);
      color: var(--accent-ink);
      border-color: transparent
    }

    .chip.solid {
      background: var(--ink);
      color: var(--bg);
      border-color: transparent
    }

    .link {
      color: var(--accent-ink);
      font-weight: 650;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: linear-gradient(currentColor, currentColor) 0 100%/0 1.5px no-repeat;
      transition: background-size .35s var(--ease)
    }

    .link:hover {
      background-size: 100% 1.5px
    }

    .link .ico {
      width: 16px;
      height: 16px;
      transition: transform .3s var(--ease)
    }

    .link:hover .ico {
      transform: translateX(3px)
    }

    /* ---------- layout ---------- */
    main {
      padding-top: var(--hdr);
      min-height: 80vh
    }

    .sec {
      padding: clamp(4.5rem, 9vw, 7.5rem) 0
    }

    .sec.alt {
      background: var(--bg-2)
    }

    .sec-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 1.5rem 3rem;
      flex-wrap: wrap;
      margin-bottom: clamp(2.2rem, 4.5vw, 3.5rem)
    }

    .sec-head .lede {
      max-width: 54ch;
      margin: 1rem 0 0;
      color: var(--muted);
      font-size: 1.08rem
    }

    .sec-head h2 {
      max-width: 20ch
    }

    .sec-head> :last-child:not(:first-child) {
      flex: none
    }

    .grid {
      display: grid;
      gap: 1.25rem
    }

    .g2 {
      grid-template-columns: repeat(2, 1fr)
    }

    .g3 {
      grid-template-columns: repeat(3, 1fr)
    }

    .g4 {
      grid-template-columns: repeat(4, 1fr)
    }

    @media (max-width:1000px) {
      .g4 {
        grid-template-columns: repeat(2, 1fr)
      }

      .g3 {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width:640px) {

      .g2,
      .g3,
      .g4 {
        grid-template-columns: 1fr
      }
    }

    /* reveal */
    [data-r] {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .9s var(--ease), transform .9s var(--ease);
      transition-delay: calc(var(--d, 0) * 80ms)
    }

    [data-r].in {
      opacity: 1;
      transform: none
    }

    /* ---------- cards ---------- */
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      transition: transform .55s var(--ease), box-shadow .55s var(--ease), border-color .35s, background-color .4s
    }

    .card.hov:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: var(--line-2)
    }

    .card-pad {
      padding: clamp(1.4rem, 2.4vw, 2rem)
    }

    .ibox {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      display: grid;
      place-items: center;
      transition: background-color .35s, color .35s, transform .5s var(--ease)
    }

    .ibox .ico {
      width: 24px;
      height: 24px
    }

    .card.hov:hover .ibox {
      background: var(--accent);
      color: var(--on-accent);
      transform: rotate(-6deg)
    }

    .go {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line-2);
      display: grid;
      place-items: center;
      flex: none;
      transition: background-color .3s, border-color .3s, color .3s, transform .5s var(--ease)
    }

    .go .ico {
      width: 18px;
      height: 18px
    }

    .card.hov:hover .go {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      transform: rotate(-45deg)
    }

    /* ---------- topo ---------- */
    .topo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      margin-top: calc(var(--hdr) * -1);
      padding-top: var(--hdr)
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 160px;
      background: linear-gradient(transparent, var(--bg));
      pointer-events: none
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: clamp(2rem, 5vw, 4rem);
      align-items: center;
      min-height: calc(100svh - var(--hdr));
      padding-top: clamp(2rem, 5vh, 3rem);
      padding-bottom: clamp(3rem, 7vh, 5rem)
    }

    .loc {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .42rem .9rem .42rem .55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      font-size: .9rem;
      font-weight: 550;
      color: var(--ink-2)
    }

    .pulse {
      position: relative;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent)
    }

    .pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-out infinite
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        opacity: .7
      }

      to {
        transform: scale(3);
        opacity: 0
      }
    }

    .hero h1 {
      font-size: clamp(3rem, 7.4vw, 6.9rem);
      line-height: .92;
      letter-spacing: -.035em;
      margin: 1.4rem 0 1.2rem;
      font-variation-settings: "wdth" 112, "wght" 820
    }

    .hero h1 .ln {
      display: block;
      overflow: hidden;
      padding-bottom: .04em
    }

    .hero h1 .ln>span {
      display: inline-block;
      animation: rise 1.1s var(--ease) both
    }

    .hero h1 .ln:nth-child(2)>span {
      animation-delay: .1s
    }

    .hero h1 .dot {
      color: var(--accent)
    }

    @keyframes rise {
      from {
        transform: translateY(105%)
      }

      to {
        transform: none
      }
    }

    .rot {
      font-size: clamp(1.15rem, 1.9vw, 1.5rem);
      font-weight: 550;
      color: var(--ink-2);
      display: flex;
      flex-wrap: wrap;
      gap: 0 .45ch;
      align-items: baseline;
      margin-bottom: 1.1rem;
      animation: fadeUp .9s .35s var(--ease) both
    }

    .rot-w {
      position: relative;
      display: inline-grid;
      height: 1.4em;
      overflow: hidden;
      vertical-align: bottom;
      color: var(--accent-ink);
      font-weight: 700
    }

    .rot-w span {
      grid-area: 1/1;
      transform: translateY(110%);
      opacity: 0;
      transition: transform .7s var(--ease), opacity .5s
    }

    .rot-w span.on {
      transform: none;
      opacity: 1
    }

    .rot-w span.out {
      transform: translateY(-110%);
      opacity: 0
    }

    .hero .pitch {
      max-width: 52ch;
      color: var(--muted);
      font-size: 1.08rem;
      animation: fadeUp .9s .45s var(--ease) both
    }

    .hero-cta {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      margin-top: 1.9rem;
      animation: fadeUp .9s .55s var(--ease) both
    }

    .stats {
      display: flex;
      gap: clamp(1.5rem, 4vw, 3rem);
      margin-top: clamp(2.2rem, 5vh, 3.2rem);
      padding-top: 1.6rem;
      border-top: 1px solid var(--line);
      animation: fadeUp .9s .65s var(--ease) both
    }

    .stat b {
      display: block;
      font-family: var(--display);
      font-variation-settings: "wdth" 112, "wght" 820;
      font-size: clamp(1.9rem, 3.2vw, 2.6rem);
      line-height: 1;
      letter-spacing: -.02em
    }

    .stat b em {
      font-style: normal;
      color: var(--accent)
    }

    .stat>span {
      font-size: .92rem;
      color: var(--muted)
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hv {
      position: relative;
      aspect-ratio: 1;
      max-width: 560px;
      width: 100%;
      justify-self: end;
      animation: fadeIn 1.2s .2s var(--ease) both
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .hv-disc {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 6%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      transform-origin: 50% 100%;
      animation: discIn 1.2s .15s var(--ease) both
    }

    .hv-disc::before {
      content: "";
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      border: 1.5px dashed rgba(10, 10, 10, .28)
    }

    @keyframes discIn {
      from {
        transform: scale(.6);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .hv-ring {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 0;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1.5px dashed var(--line-2);
      animation: spin 50s linear infinite
    }

    .hv-ring::after {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: var(--ink)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .hv img {
      position: absolute;
      left: 3%;
      right: 3%;
      bottom: 6%;
      width: 94%;
      height: auto;
      -webkit-mask-image: linear-gradient(#000 0 45%, transparent 45%), radial-gradient(circle closest-side at 50% 59.6%, #000 99.5%, transparent 100%);
      mask-image: linear-gradient(#000 0 45%, transparent 45%), radial-gradient(circle closest-side at 50% 59.6%, #000 99.5%, transparent 100%);
      animation: popIn 1.3s .35s var(--ease) both
    }

    @keyframes popIn {
      from {
        transform: translateY(12%);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .float {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .7rem .95rem .7rem .7rem;
      border-radius: 16px;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-s);
      font-size: .9rem;
      line-height: 1.25;
      animation: fadeUp .9s var(--ease) both, bob 6s ease-in-out infinite
    }

    .float .ibox {
      width: 38px;
      height: 38px;
      border-radius: 11px
    }

    .float .ibox .ico {
      width: 19px;
      height: 19px
    }

    .float b {
      display: block;
      font-weight: 700
    }

    .float small {
      color: var(--muted);
      font-size: .82rem
    }

    .f1 {
      left: -4%;
      top: 22%;
      animation-delay: .9s, 0s
    }

    .f2 {
      right: -2%;
      top: 44%;
      animation-delay: 1.05s, -2s
    }

    .f3 {
      left: 4%;
      bottom: 12%;
      animation-delay: 1.2s, -4s
    }

    @keyframes bob {

      0%,
      100% {
        translate: 0 0
      }

      50% {
        translate: 0 -10px
      }
    }

    @media (max-width:980px) {
      .hero-grid {
        grid-template-columns: 1fr;
        min-height: 0;
        padding-top: 1.5rem
      }

      .hv {
        justify-self: center;
        max-width: 440px;
        order: 2
      }

      .f1 {
        left: 0
      }

      .f2 {
        right: 0
      }
    }

    @media (max-width:520px) {
      .float {
        font-size: .8rem;
        padding: .5rem .7rem .5rem .5rem
      }

      .float .ibox {
        width: 32px;
        height: 32px
      }

      .stats {
        gap: 1.2rem
      }

      .f3 {
        display: none
      }
    }

    /* marquee */
    .marquee {
      position: relative;
      z-index: 2;
      border-block: 1px solid var(--line);
      padding: 1.3rem 0;
      overflow: hidden;
      background: var(--bg)
    }

    .marquee-in {
      display: flex;
      width: max-content;
      animation: mq 38s linear infinite
    }

    .marquee:hover .marquee-in {
      animation-play-state: paused
    }

    .marquee ul {
      display: flex;
      gap: 3.5rem;
      list-style: none;
      margin: 0;
      padding: 0 1.75rem
    }

    .marquee li {
      display: flex;
      align-items: center;
      gap: 3.5rem;
      font-family: var(--display);
      font-variation-settings: "wdth" 115, "wght" 760;
      font-size: clamp(1.1rem, 1.8vw, 1.45rem);
      color: var(--muted);
      white-space: nowrap;
      transition: color .3s
    }

    .marquee li:hover {
      color: var(--ink)
    }

    .marquee li::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent)
    }

    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    .mq-label {
      text-align: center;
      font-size: .9rem;
      color: var(--muted);
      margin: 0 0 1rem
    }

    /* ---------- BENTO ---------- */
    .bento {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: minmax(190px, auto);
      gap: 1.25rem
    }

    .bento .card {
      overflow: hidden
    }

    .b-map {
      grid-column: span 2;
      display: flex;
      flex-direction: column
    }

    .b-tools {
      grid-column: span 2
    }

    .b-now {
      grid-column: span 2
    }

    @media (max-width:1000px) {
      .bento {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media (max-width:600px) {
      .bento {
        grid-template-columns: 1fr
      }

      .b-map,
      .b-tools,
      .b-now {
        grid-column: auto
      }
    }

    .bk {
      font-size: .9rem;
      color: var(--muted);
      margin: 0 0 .6rem;
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .bk .ico {
      width: 17px;
      height: 17px;
      color: var(--accent-ink)
    }

    .big {
      font-family: var(--display);
      font-variation-settings: "wdth" 112, "wght" 830;
      font-size: clamp(3rem, 5vw, 4.2rem);
      line-height: .95;
      letter-spacing: -.03em
    }

    .big em {
      font-style: normal;
      color: var(--accent)
    }

    .b-stat p {
      margin: .5rem 0 0;
      color: var(--muted);
      font-size: .96rem
    }

    .dotmap {
      width: 100%;
      height: auto;
      margin-top: auto;
      padding-top: .8rem
    }

    .dotmap circle {
      fill: var(--dot);
      transition: fill .4s
    }

    .dotmap circle.g,
    .dotmap circle.o {
      fill: var(--accent)
    }

    .dotmap .arc {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.2;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 2.4s var(--ease-io)
    }

    .dotmap.in .arc {
      stroke-dashoffset: 0
    }

    .dotmap .arc2 {
      fill: none;
      stroke: var(--card);
      stroke-width: 3.4;
      stroke-dasharray: 3 10
    }

    .dotmap .pin {
      fill: var(--ink)
    }

    .dotmap .arc {
      stroke-width: 3.5
    }

    .dotmap .ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      transform-box: fill-box;
      transform-origin: center;
      animation: ping 2.6s ease-out infinite
    }

    @keyframes ping {
      from {
        transform: scale(.4);
        opacity: 1
      }

      to {
        transform: scale(2.8);
        opacity: 0
      }
    }

    .dotmap text {
      font-family: var(--display);
      font-variation-settings: "wdth" 100, "wght" 700;
      font-size: 40px;
      fill: var(--ink)
    }

    .dotmap .km {
      fill: var(--accent-ink);
      font-size: 42px
    }

    @media (max-width:600px) {
      .dotmap text {
        font-size: 56px
      }
    }

    .legend {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      font-size: .92rem
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .legend i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent)
    }

    .legend b {
      font-weight: 700
    }

    .tchips {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem
    }

    .tchip {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .9rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg-2);
      font-weight: 600;
      font-size: .94rem;
      transition: transform .3s var(--ease), border-color .3s, background-color .3s
    }

    .tchip:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .tchip i {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--accent)
    }

    .lgs {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .lgs li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .42rem 0;
      border-bottom: 1px dashed var(--line);
      font-size: .95rem
    }

    .lgs li:last-child {
      border: 0
    }

    .lgs b {
      font-weight: 650
    }

    .bars {
      display: flex;
      gap: 3px
    }

    .bars i {
      width: 14px;
      height: 5px;
      border-radius: 3px;
      background: var(--line-2)
    }

    .bars i.on {
      background: var(--accent)
    }

    .edu-l {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .edu-l li {
      padding: .55rem 0;
      border-bottom: 1px dashed var(--line)
    }

    .edu-l li:last-child {
      border: 0
    }

    .edu-l b {
      display: block;
      font-size: .98rem
    }

    .edu-l span {
      font-size: .88rem;
      color: var(--muted)
    }

    .b-now {
      background: var(--ink);
      color: var(--bg);
      border-color: transparent
    }

    .b-now .bk {
      color: color-mix(in srgb, var(--bg) 70%, transparent)
    }

    .b-now h3 {
      font-size: 1.45rem;
      margin: .2rem 0 .5rem
    }

    .b-now p {
      color: color-mix(in srgb, var(--bg) 72%, transparent);
      margin: 0
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-weight: 650;
      color: var(--accent);
      font-size: .9rem
    }

    /* ---------- services ---------- */
    .svc {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%
    }

    .svc h3 {
      font-size: 1.25rem
    }

    .svc p {
      margin: 0;
      color: var(--muted);
      font-size: .98rem
    }

    .svc .tags {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: .6rem
    }

    .svc .rel {
      border-top: 1px solid var(--line);
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: .35rem
    }

    .svc .rel small {
      color: var(--muted);
      font-size: .85rem
    }

    .svc .rel a {
      font-size: .94rem
    }

    .svc-n {
      position: absolute;
      right: 1.4rem;
      top: 1.2rem;
      font-family: var(--display);
      font-variation-settings: "wdth" 112, "wght" 800;
      font-size: .9rem;
      color: var(--line-2)
    }

    /* ---------- BUILD ---------- */
    .build {
      position: relative;
      height: 600vh
    }

    .build-stick {
      position: sticky;
      top: var(--hdr);
      height: calc(100vh - var(--hdr));
      display: grid;
      grid-template-columns: minmax(300px, .8fr) 1.5fr;
      gap: clamp(1.5rem, 4vw, 4rem);
      align-items: center;
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 1rem var(--gut);
      overflow: hidden
    }

    .build h2 {
      font-size: clamp(1.9rem, 3.4vw, 2.9rem)
    }

    .build-intro {
      color: var(--muted);
      margin: .9rem 0 0;
      max-width: 38ch
    }

    .phases {
      position: relative;
      margin-top: 2rem;
      min-height: 200px
    }

    .phase {
      position: absolute;
      inset: 0 0 auto 0;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .5s, transform .6s var(--ease)
    }

    .phase.on {
      opacity: 1;
      transform: none
    }

    .phase .k {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-size: .88rem;
      font-weight: 650;
      color: var(--accent-ink)
    }

    .phase h3 {
      font-size: clamp(1.5rem, 2.3vw, 1.95rem);
      margin: .4rem 0 .6rem
    }

    .phase p {
      color: var(--muted);
      margin: 0;
      max-width: 40ch
    }

    .ticks {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 1.4rem
    }

    .ticks i {
      height: 4px;
      border-radius: 3px;
      background: var(--line);
      overflow: hidden
    }

    .ticks i b {
      display: block;
      height: 100%;
      background: var(--accent);
      transform-origin: left;
      transform: scaleX(0)
    }

    .build-fig {
      position: relative;
      border-radius: var(--r-xl);
      background: var(--card);
      border: 1px solid var(--line);
      padding: clamp(1rem, 2.5vw, 2rem);
      box-shadow: var(--shadow)
    }

    .build-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible
    }

    .build-svg .ln {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.2;
      stroke-linejoin: round
    }

    .build-svg .conc {
      fill: url(#bConc);
      stroke: var(--ink);
      stroke-width: 2.2
    }

    .build-svg .soilf {
      fill: url(#bSoil)
    }

    .build-svg .gnd {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2
    }

    .build-svg .dash {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 8 7
    }

    .build-svg .wat {
      fill: var(--water)
    }

    .build-svg .wl {
      fill: none;
      stroke: var(--muted);
      stroke-width: 2.2
    }

    .build-svg .road {
      fill: none;
      stroke: var(--ink);
      stroke-width: 7;
      stroke-linecap: round
    }

    .build-svg .dim {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.6
    }

    .build-svg .bg-cell {
      fill: var(--card)
    }

    .build-svg .prop {
      fill: var(--conc-l);
      stroke: var(--ink);
      stroke-width: 1.2
    }

    .build-svg text {
      font-family: var(--display);
      font-variation-settings: "wdth" 85, "wght" 650;
      font-size: 20px;
      fill: var(--accent-ink)
    }

    .build-svg .lbl {
      fill: var(--muted)
    }

    .build-svg .grow {
      transform-box: fill-box;
      transform-origin: 50% 100%
    }

    .build-svg .growx {
      transform-box: fill-box;
      transform-origin: 0 50%
    }

    .pat-c {
      fill: var(--conc)
    }

    .pat-cl {
      stroke: var(--conc-l)
    }

    .pat-s {
      fill: var(--soil)
    }

    .pat-sd {
      fill: var(--soil-dot)
    }

    .truck {
      opacity: 0
    }

    .truck.run {
      opacity: 1;
      animation: drive 6s linear infinite
    }

    .truck .tb {
      fill: var(--card)
    }

    .truck .tw {
      fill: var(--ink)
    }

    @keyframes drive {
      from {
        transform: translateX(-160px)
      }

      to {
        transform: translateX(1080px)
      }
    }

    .flow {
      animation: flow 2.2s linear infinite
    }

    @keyframes flow {
      to {
        transform: translateX(-40px)
      }
    }

    @media (max-width:900px) {
      .build {
        height: 560vh
      }

      .build-stick {
        grid-template-columns: 1fr;
        align-content: center;
        gap: 1rem
      }

      .build-intro {
        display: none
      }

      .build-fig {
        order: -1;
        padding: .6rem;
        overflow: hidden
      }

      .build-svg {
        width: 150%;
        margin-left: -25%
      }

      .phases {
        min-height: 190px;
        margin-top: .5rem
      }
    }

    /* ---------- project cards ---------- */
    .pcard {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      overflow: hidden;
      height: 100%
    }

    .pc-cover {
      position: relative;
      aspect-ratio: 4/3;
      margin: 8px 8px 0;
      border-radius: calc(var(--r-lg) - 6px);
      background: var(--bg-2);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--ink);
      isolation: isolate
    }

    .pc-cover::before {
      content: "";
      position: absolute;
      inset: -20%;
      background: radial-gradient(closest-side at 70% 30%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%);
      opacity: .55;
      transition: opacity .6s, transform 1s var(--ease);
      z-index: -1
    }

    .pc-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--line-2) 1px, transparent 1.2px);
      background-size: 18px 18px;
      opacity: .6;
      z-index: -1
    }

    .card.hov:hover .pc-cover::before {
      opacity: 1;
      transform: translate(-6%, 6%) scale(1.1)
    }

    .pc-cover svg {
      width: 82%;
      height: auto;
      transition: transform .8s var(--ease)
    }

    .card.hov:hover .pc-cover svg {
      transform: scale(1.06) translateY(-2%)
    }

    .pc-cat {
      position: absolute;
      left: 14px;
      top: 14px
    }

    .pc-year {
      position: absolute;
      right: 14px;
      top: 14px;
      font-size: .82rem;
      font-weight: 650;
      padding: .32rem .7rem;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line)
    }

    .pc-body {
      padding: 1.3rem 1.4rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: .55rem;
      flex: 1
    }

    .pc-body h3 {
      font-size: 1.2rem;
      line-height: 1.2
    }

    .pc-body p {
      margin: 0;
      color: var(--muted);
      font-size: .96rem
    }

    .pc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--line)
    }

    .pc-meta {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .88rem;
      color: var(--muted);
      min-width: 0
    }

    .pc-meta span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pc-meta .ico {
      width: 16px;
      height: 16px;
      color: var(--accent-ink)
    }

    .illu {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .illu .a {
      stroke: var(--accent)
    }

    .illu .w {
      stroke: var(--muted)
    }

    .illu .s {
      stroke: var(--muted);
      stroke-dasharray: 5 6;
      opacity: .7
    }

    .illu .f {
      fill: currentColor;
      stroke: none
    }

    .illu .fa {
      fill: var(--accent);
      stroke: none
    }

    .illu .thick {
      stroke-width: 12;
      stroke-linecap: butt
    }

    .illu text {
      font-family: var(--display);
      font-variation-settings: "wdth" 85, "wght" 700;
      font-size: 17px;
      fill: var(--accent-ink);
      stroke: none
    }

    .illu .dr {
      stroke-dasharray: 1;
      stroke-dashoffset: 0
    }

    .card.hov:hover .illu .dr {
      animation: redraw 1.4s var(--ease)
    }

    @keyframes redraw {
      from {
        stroke-dashoffset: 1
      }

      to {
        stroke-dashoffset: 0
      }
    }

    .feat {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 1.25rem
    }

    .feat> :first-child {
      grid-row: span 2
    }

    .feat> :first-child .pc-cover {
      aspect-ratio: auto;
      flex: 1;
      min-height: 340px
    }

    .feat> :not(:first-child) {
      flex-direction: row
    }

    .feat> :not(:first-child) .pc-cover {
      aspect-ratio: auto;
      width: 42%;
      margin: 8px;
      flex: none
    }

    .feat> :not(:first-child) .pc-body {
      padding-left: .4rem
    }

    @media (max-width:900px) {
      .feat {
        grid-template-columns: 1fr;
        grid-template-rows: auto
      }

      .feat> :first-child {
        grid-row: auto
      }

      .feat> :first-child .pc-cover {
        aspect-ratio: 4/3;
        min-height: 0
      }

      .feat> :not(:first-child) {
        flex-direction: column
      }

      .feat> :not(:first-child) .pc-cover {
        width: auto;
        aspect-ratio: 4/3;
        margin: 8px 8px 0
      }

      .feat> :not(:first-child) .pc-body {
        padding-left: 1.4rem
      }
    }

    /* filters */
    .ftabs {
      position: relative;
      display: inline-flex;
      flex-wrap: wrap;
      gap: .25rem;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-2);
      margin-bottom: 2.2rem
    }

    .ftabs button {
      position: relative;
      z-index: 1;
      border: 0;
      background: none;
      padding: .6rem 1.05rem;
      border-radius: 999px;
      font-weight: 650;
      font-size: .94rem;
      cursor: pointer;
      color: var(--muted);
      transition: color .3s;
      display: flex;
      gap: .45rem;
      align-items: center
    }

    .ftabs button span {
      font-size: .78rem;
      padding: .05rem .45rem;
      border-radius: 999px;
      background: var(--line);
      color: var(--ink-2);
      transition: background-color .3s, color .3s
    }

    .ftabs button[aria-pressed="true"] {
      color: var(--bg)
    }

    .ftabs button[aria-pressed="true"] span {
      background: var(--accent);
      color: var(--on-accent)
    }

    .ftabs .ind {
      position: absolute;
      z-index: 0;
      top: 5px;
      left: 0;
      height: calc(100% - 10px);
      border-radius: 999px;
      background: var(--ink);
      transition: transform .5s var(--ease), width .5s var(--ease)
    }

    @media (max-width:700px) {
      .ftabs {
        border-radius: 20px
      }

      .ftabs .ind {
        display: none
      }

      .ftabs button[aria-pressed="true"] {
        background: var(--ink)
      }
    }

    .pgrid {
      transition: opacity .25s
    }

    .pgrid.fade {
      opacity: 0
    }

    /* ---------- page hero ---------- */
    .phero {
      position: relative;
      overflow: hidden;
      background: var(--bg-2);
      border-bottom: 1px solid var(--line);
      padding: clamp(3.5rem, 8vw, 6rem) 0 clamp(3rem, 6vw, 4.5rem)
    }

    .phero .wrap {
      position: relative;
      z-index: 1
    }

    .crumb {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 1.4rem
    }

    .crumb a {
      text-decoration: none
    }

    .crumb a:hover {
      color: var(--ink)
    }

    .crumb .ico {
      width: 14px;
      height: 14px
    }

    .phero h1 {
      font-size: clamp(2.7rem, 6.5vw, 5.4rem);
      line-height: .95;
      letter-spacing: -.035em;
      font-variation-settings: "wdth" 112, "wght" 820;
      max-width: 16ch
    }

    .phero h1 .dot {
      color: var(--accent)
    }

    .phero .lede {
      font-size: clamp(1.08rem, 1.5vw, 1.25rem);
      color: var(--muted);
      max-width: 58ch;
      margin: 1.3rem 0 0
    }

    .phero>.wrap>* {
      animation: fadeUp .8s var(--ease) both
    }

    .phero>.wrap> :nth-child(2) {
      animation-delay: .08s
    }

    .phero>.wrap> :nth-child(3) {
      animation-delay: .16s
    }

    .phero>.wrap> :nth-child(4) {
      animation-delay: .24s
    }

    /* ---------- detail ---------- */
    .meta4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 2.2rem
    }

    @media (max-width:860px) {
      .meta4 {
        grid-template-columns: 1fr 1fr
      }
    }

    .meta4 .card {
      padding: 1rem 1.1rem;
      display: flex;
      gap: .8rem;
      align-items: flex-start
    }

    .meta4 .ibox {
      width: 40px;
      height: 40px;
      border-radius: 11px
    }

    .meta4 .ibox .ico {
      width: 19px;
      height: 19px
    }

    .meta4 small {
      display: block;
      color: var(--muted);
      font-size: .82rem
    }

    .meta4 b {
      display: block;
      font-size: .95rem;
      line-height: 1.3
    }

    .d-cover {
      aspect-ratio: 21/9;
      margin: 0;
      border-radius: var(--r-xl)
    }

    .d-cover svg {
      width: 56%
    }

    @media (max-width:700px) {
      .d-cover {
        aspect-ratio: 4/3
      }

      .d-cover svg {
        width: 84%
      }
    }

    .d-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: clamp(2rem, 5vw, 4rem);
      margin-top: clamp(2.5rem, 5vw, 4rem);
      align-items: start
    }

    @media (max-width:960px) {
      .d-layout {
        grid-template-columns: 1fr
      }
    }

    .d-main,
    .side {
      min-width: 0
    }

    .d-main h2 {
      font-size: 1.6rem;
      margin: 0 0 .9rem
    }

    .d-main section+section {
      margin-top: 2.6rem
    }

    .d-main p {
      color: var(--ink-2);
      max-width: 68ch
    }

    .checks {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: .8rem
    }

    .checks li {
      display: flex;
      gap: .8rem;
      align-items: flex-start;
      padding: 1rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--card)
    }

    .checks .ck {
      flex: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      display: grid;
      place-items: center
    }

    .checks .ck .ico {
      width: 15px;
      height: 15px;
      stroke-width: 2.6
    }

    .result {
      border-radius: var(--r-lg);
      background: var(--ink);
      color: var(--bg);
      padding: 1.6rem 1.7rem;
      position: relative;
      overflow: hidden
    }

    .result::after {
      content: "";
      position: absolute;
      right: -50px;
      top: -50px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .9
    }

    .result p {
      position: relative;
      z-index: 1;
      color: inherit;
      margin: 0;
      font-size: 1.12rem;
      max-width: 52ch
    }

    .side {
      position: sticky;
      top: calc(var(--hdr) + 1.5rem);
      display: flex;
      flex-direction: column;
      gap: 1rem
    }

    .side .card {
      padding: 1.4rem
    }

    .side small {
      display: block;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: .3rem
    }

    .side .who {
      display: flex;
      gap: .8rem;
      align-items: center
    }

    .avatar {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #B83A00);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--display);
      font-variation-settings: "wdth" 110, "wght" 800;
      font-size: 1rem
    }

    .phs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.4rem
    }

    .ph {
      aspect-ratio: 4/3;
      border-radius: var(--r-md);
      border: 1.5px dashed var(--line-2);
      background: var(--bg-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      padding: 1rem
    }

    .ph .ico {
      width: 28px;
      height: 28px
    }

    .ph {
      min-width: 0
    }

    @media (max-width:520px) {
      .phs {
        grid-template-columns: 1fr
      }
    }

    .pn {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: clamp(3rem, 6vw, 4.5rem)
    }

    @media (max-width:700px) {
      .pn {
        grid-template-columns: 1fr
      }
    }

    .pn a {
      text-decoration: none;
      padding: 1.3rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1rem
    }

    .pn a.nx {
      flex-direction: row-reverse;
      text-align: right
    }

    .pn small {
      display: block;
      color: var(--muted);
      font-size: .86rem
    }

    .pn b {
      font-family: var(--display);
      font-variation-settings: "wdth" 104, "wght" 700;
      font-size: 1.05rem;
      line-height: 1.25
    }

    .pn .go.back .ico {
      transform: rotate(180deg)
    }

    .card.hov:hover .go.back {
      transform: rotate(45deg)
    }

    /* ---------- about ---------- */
    .bio {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: clamp(2rem, 6vw, 5rem);
      align-items: center
    }

    @media (max-width:900px) {
      .bio {
        grid-template-columns: 1fr
      }
    }

    .bio-photo {
      position: relative;
      aspect-ratio: 1;
      max-width: 440px;
      width: 100%
    }

    .bio-photo .hv-disc {
      left: 8%;
      right: 8%;
      bottom: 4%
    }

    .bio-photo img {
      position: absolute;
      left: 0;
      bottom: 4%;
      width: 100%;
      height: auto;
      -webkit-mask-image: linear-gradient(#000 0 45%, transparent 45%), radial-gradient(circle closest-side at 50% 58%, #000 99.5%, transparent 100%);
      mask-image: linear-gradient(#000 0 45%, transparent 45%), radial-gradient(circle closest-side at 50% 58%, #000 99.5%, transparent 100%)
    }

    .bio-text .lead {
      font-size: clamp(1.25rem, 2vw, 1.6rem);
      line-height: 1.45;
      color: var(--ink);
      font-weight: 500
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 2rem
    }

    .facts .card {
      padding: 1.1rem
    }

    .facts b {
      display: block;
      font-family: var(--display);
      font-variation-settings: "wdth" 112, "wght" 820;
      font-size: 1.9rem;
      line-height: 1
    }

    .facts b em {
      font-style: normal;
      color: var(--accent)
    }

    .facts .card>span {
      font-size: .88rem;
      color: var(--muted)
    }

    .tline {
      position: relative;
      max-width: 1000px;
      margin: 0 auto
    }

    .tline::before,
    .tline .fill {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      margin-left: -1px;
      background: var(--line)
    }

    .tline .fill {
      background: var(--accent);
      bottom: auto;
      height: 0;
      transition: height .1s linear
    }

    .ti {
      position: relative;
      width: 50%;
      padding: 0 2.6rem 2.2rem 0
    }

    .ti:nth-child(even) {
      margin-left: 50%;
      padding: 0 0 2.2rem 2.6rem
    }

    .ti::before {
      content: "";
      position: absolute;
      top: 1.6rem;
      right: -9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bg);
      border: 3px solid var(--line-2);
      z-index: 1;
      transition: border-color .4s, background-color .4s
    }

    .ti:nth-child(even)::before {
      right: auto;
      left: -9px
    }

    .ti.in::before {
      border-color: var(--accent);
      background: var(--accent)
    }

    .ti .card {
      padding: 1.4rem 1.5rem
    }

    .ti .when {
      display: flex;
      align-items: center;
      gap: .5rem;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: .7rem
    }

    .ti h3 {
      font-size: 1.18rem;
      margin-bottom: .25rem
    }

    .ti .org {
      color: var(--accent-ink);
      font-weight: 600;
      font-size: .95rem
    }

    .ti p {
      color: var(--muted);
      margin: .6rem 0 0;
      font-size: .96rem
    }

    @media (max-width:820px) {

      .tline::before,
      .tline .fill {
        left: 9px
      }

      .ti,
      .ti:nth-child(even) {
        width: auto;
        margin-left: 0;
        padding: 0 0 1.6rem 2.4rem
      }

      .ti::before,
      .ti:nth-child(even)::before {
        left: 0;
        right: auto
      }
    }

    .skill-c h3 {
      display: flex;
      align-items: center;
      gap: .7rem;
      font-size: 1.12rem;
      margin-bottom: 1rem
    }

    .skill-c h3 .ibox {
      width: 40px;
      height: 40px;
      border-radius: 11px
    }

    .skill-c h3 .ibox .ico {
      width: 19px;
      height: 19px
    }

    .skill-c ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem
    }

    .cert {
      display: flex;
      flex-direction: column;
      gap: .9rem;
      height: 100%
    }

    .cert-top {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .seal {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent-ink);
      position: relative
    }

    .seal::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px dashed color-mix(in srgb, var(--accent) 50%, transparent);
      transition: transform 1s var(--ease)
    }

    .card.hov:hover .seal::after {
      transform: rotate(90deg)
    }

    .seal .ico {
      width: 24px;
      height: 24px
    }

    .cert h3 {
      font-size: 1.06rem;
      line-height: 1.3
    }

    .cert p {
      margin: auto 0 0;
      color: var(--muted);
      font-size: .9rem
    }

    .mis {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      height: 100%
    }

    .mis b {
      font-family: var(--display);
      font-variation-settings: "wdth" 108, "wght" 750;
      font-size: 1.08rem
    }

    .mis p {
      margin: 0;
      color: var(--muted);
      font-size: .93rem
    }

    .ref {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      height: 100%
    }

    .ref .who {
      display: flex;
      gap: .9rem;
      align-items: center
    }

    .ref .avatar {
      width: 56px;
      height: 56px;
      font-size: 1.1rem
    }

    .ref h3 {
      font-size: 1.1rem
    }

    .ref .role {
      font-size: .9rem;
      color: var(--muted)
    }

    .ref .for {
      border-top: 1px solid var(--line);
      padding-top: .9rem;
      font-size: .88rem;
      color: var(--muted);
      margin-top: auto
    }

    .ref .for a {
      display: block;
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
      margin-top: .2rem;
      line-height: 1.35
    }

    .ref .for a:hover {
      color: var(--accent-ink)
    }

    .eng {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .eng li {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: .75rem 0;
      border-bottom: 1px dashed var(--line);
      font-size: .97rem
    }

    .eng li:last-child {
      border: 0
    }

    .eng span {
      color: var(--muted);
      text-align: right
    }

    /* steps */
    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 1.25rem;
      counter-reset: s
    }

    @media (max-width:1000px) {
      .steps {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (max-width:600px) {
      .steps {
        grid-template-columns: 1fr
      }
    }

    .step {
      counter-increment: s;
      padding: 1.5rem;
      height: 100%
    }

    .step::before {
      content: "0" counter(s);
      display: block;
      font-family: var(--display);
      font-variation-settings: "wdth" 120, "wght" 860;
      font-size: 2.6rem;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--accent);
      margin-bottom: 1rem;
      transition: color .4s
    }

    .step.hov:hover::before {
      color: var(--accent)
    }

    .step h3 {
      font-size: 1.12rem;
      margin-bottom: .45rem
    }

    .step p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem
    }

    /* publications */
    .pfeat {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      overflow: hidden;
      margin-bottom: 1.25rem
    }

    @media (max-width:860px) {
      .pfeat {
        grid-template-columns: 1fr
      }
    }

    .pfeat .card-pad {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: center
    }

    .pfeat h2 {
      font-size: clamp(1.6rem, 3vw, 2.4rem)
    }

    .pfeat p {
      color: var(--muted);
      margin: 0
    }

    .pfeat-vis {
      position: relative;
      background: #0A0A0A;
      color: #fff;
      display: grid;
      place-items: center;
      min-height: 260px;
      overflow: hidden
    }

    .pfeat-vis::before {
      content: "";
      position: absolute;
      width: 70%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      opacity: .95;
      transition: transform 1s var(--ease)
    }

    .card.hov:hover .pfeat-vis::before {
      transform: scale(1.08)
    }

    .pfeat-vis div {
      position: relative;
      text-align: center;
      color: var(--on-accent)
    }

    .pfeat-vis b {
      display: block;
      font-family: var(--display);
      font-variation-settings: "wdth" 120, "wght" 860;
      font-size: clamp(3rem, 6vw, 4.6rem);
      line-height: .9
    }

    .pfeat-vis span {
      font-weight: 700
    }

    .pub {
      display: flex;
      flex-direction: column;
      gap: .8rem;
      height: 100%
    }

    .pub h3 {
      font-size: 1.15rem;
      line-height: 1.3
    }

    .pub p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem
    }

    .pub .src {
      margin-top: auto;
      padding-top: .9rem;
      border-top: 1px solid var(--line);
      font-size: .88rem;
      color: var(--muted);
      display: flex;
      gap: .5rem;
      align-items: center
    }

    .pub .src .ico {
      width: 16px;
      height: 16px;
      color: var(--accent-ink)
    }

    /* contact */
    .ct {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 1.5rem;
      align-items: start
    }

    @media (max-width:960px) {
      .ct {
        grid-template-columns: 1fr
      }
    }

    .ct-info {
      display: flex;
      flex-direction: column;
      gap: 1rem
    }

    .ci {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.2rem
    }

    .ci small {
      display: block;
      color: var(--muted);
      font-size: .84rem
    }

    .ci a,
    .ci span.v {
      font-weight: 650;
      text-decoration: none;
      word-break: break-word
    }

    .ci a:hover {
      color: var(--accent-ink)
    }

    .ci .grow {
      flex: 1;
      min-width: 0
    }

    .cpy {
      flex: none;
      border: 1px solid var(--line-2);
      background: var(--bg);
      border-radius: 999px;
      padding: .4rem .8rem;
      font-size: .82rem;
      font-weight: 650;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .35rem;
      transition: border-color .2s, background-color .2s, color .2s
    }

    .cpy:hover {
      border-color: var(--ink)
    }

    .cpy.ok {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent)
    }

    .cpy .ico {
      width: 15px;
      height: 15px
    }

    .clocks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem
    }

    .clock {
      padding: 1.1rem 1.2rem
    }

    .clock small {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: .84rem
    }

    .clock small .ico {
      width: 18px;
      height: 18px;
      color: var(--accent-ink)
    }

    .clock b {
      display: block;
      font-family: var(--display);
      font-variation-settings: "wdth" 112, "wght" 820;
      font-size: 2rem;
      line-height: 1.1;
      margin-top: .3rem;
      font-variant-numeric: tabular-nums
    }

    .qrc {
      display: flex;
      gap: 1.1rem;
      align-items: center;
      padding: 1.1rem 1.2rem
    }

    .qrc .qr {
      flex: none;
      width: 96px;
      height: 96px;
      padding: 7px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line)
    }

    .qrc .qr svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .qrc b {
      display: block;
      margin-bottom: .2rem
    }

    .qrc p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem
    }

    .form {
      padding: clamp(1.5rem, 3.5vw, 2.6rem)
    }

    .form h2 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      margin-bottom: .5rem
    }

    .form>p {
      color: var(--muted)
    }

    fieldset {
      border: 0;
      margin: 1.6rem 0 1.4rem;
      padding: 0
    }

    legend {
      font-weight: 650;
      font-size: .95rem;
      margin-bottom: .7rem;
      padding: 0
    }

    .subj {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem
    }

    .subj label {
      position: relative;
      cursor: pointer
    }

    .subj input {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0
    }

    .subj span {
      display: inline-block;
      padding: .55rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      font-weight: 600;
      font-size: .92rem;
      transition: background-color .25s, color .25s, border-color .25s, transform .25s var(--ease)
    }

    .subj span:hover {
      border-color: var(--ink)
    }

    .subj input:checked+span {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .subj input:focus-visible+span {
      outline: 2.5px solid var(--accent);
      outline-offset: 2px
    }

    .fg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 1rem
    }

    .fg .full {
      grid-column: 1/-1
    }

    @media (max-width:600px) {
      .fg {
        grid-template-columns: 1fr
      }
    }

    .fl {
      position: relative;
      margin-bottom: 1rem
    }

    .fl input,
    .fl textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: var(--bg-2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 1.45rem 1rem .55rem;
      transition: border-color .25s, background-color .25s, box-shadow .25s;
      resize: vertical
    }

    .fl textarea {
      min-height: 150px
    }

    .fl label {
      position: absolute;
      left: 1rem;
      top: 1.05rem;
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
      transition: transform .25s var(--ease), font-size .25s, top .25s, color .25s
    }

    .fl input:focus,
    .fl textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 4px var(--accent-soft)
    }

    .fl input:focus+label,
    .fl input:not(:placeholder-shown)+label,
    .fl textarea:focus+label,
    .fl textarea:not(:placeholder-shown)+label {
      top: .45rem;
      font-size: .78rem;
      color: var(--accent-ink);
      font-weight: 600
    }

    .fl .err {
      display: none;
      color: #D92D20;
      font-size: .85rem;
      margin-top: .3rem
    }

    .fl.bad input,
    .fl.bad textarea {
      border-color: #D92D20
    }

    .fl.bad .err {
      display: block
    }

    .send {
      position: relative;
      overflow: hidden
    }

    .send.ok {
      background: var(--ink);
      color: var(--bg)
    }

    .notice {
      display: none;
      margin-top: 1rem;
      padding: 1rem 1.1rem;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--ink);
      font-size: .95rem
    }

    .notice.show {
      display: block;
      animation: fadeUp .5s var(--ease)
    }

    /* 404 */
    .nf {
      position: relative;
      overflow: hidden;
      min-height: calc(100vh - var(--hdr));
      display: grid;
      place-items: center;
      text-align: center;
      padding: 4rem var(--gut)
    }

    .nf>div {
      position: relative;
      z-index: 1
    }

    .nf b {
      display: block;
      font-family: var(--display);
      font-variation-settings: "wdth" 125, "wght" 900;
      font-size: clamp(7rem, 24vw, 17rem);
      line-height: .85;
      color: transparent;
      -webkit-text-stroke: 2px var(--accent)
    }

    .nf p {
      font-size: 1.2rem;
      color: var(--muted);
      margin: 1.2rem auto 2rem;
      max-width: 32ch
    }

    /* ---------- footer ---------- */
    .ftr {
      position: relative;
      overflow: hidden;
      background: #0A0A0A;
      color: #F4F4F2;
      padding: clamp(4rem, 8vw, 6rem) 0 2rem;
      --line: #242424;
      --muted: #A3A3A0
    }

    .ftr-cta {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 2rem;
      flex-wrap: wrap;
      padding-bottom: clamp(3rem, 6vw, 4.5rem);
      border-bottom: 1px solid #242424
    }

    .ftr-cta h2 {
      font-size: clamp(2.4rem, 6vw, 5rem);
      line-height: .95;
      letter-spacing: -.035em;
      max-width: 13ch;
      font-variation-settings: "wdth" 112, "wght" 820
    }

    .ftr-cta h2 .dot {
      color: #FF6A13
    }

    .ftr-cols {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 2rem;
      padding: 3rem 0
    }

    @media (max-width:860px) {
      .ftr-cols {
        grid-template-columns: 1fr 1fr
      }
    }

    .ftr-cols h4 {
      font-size: .95rem;
      font-variation-settings: "wdth" 100, "wght" 700;
      color: #A3A3A0;
      margin-bottom: 1rem;
      letter-spacing: 0
    }

    .ftr-cols ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: .6rem
    }

    .ftr-cols a {
      text-decoration: none;
      color: #F4F4F2;
      transition: color .2s
    }

    .ftr-cols a:hover {
      color: #FF6A13
    }

    .ftr-cols p {
      color: #A3A3A0;
      max-width: 34ch;
      margin: .9rem 0 0;
      font-size: .95rem
    }

    .ftr .brand {
      color: #F4F4F2
    }

    .ftr .logo {
      background: #F4F4F2;
      color: #0A0A0A
    }

    .ftr .logo::after {
      border-color: #0A0A0A
    }

    .ftr-bot {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding-top: 1.6rem;
      border-top: 1px solid #242424;
      color: #A3A3A0;
      font-size: .9rem
    }

    .ftr-big {
      font-family: var(--display);
      font-variation-settings: "wdth" 125, "wght" 880;
      font-size: clamp(3rem, 13.2vw, 13rem);
      line-height: .8;
      letter-spacing: -.04em;
      white-space: nowrap;
      color: transparent;
      -webkit-text-stroke: 1px #2A2A2A;
      margin: 2.5rem 0 -1.5rem;
      user-select: none;
      text-align: center
    }

    .to-top {
      border: 1px solid #333;
      background: none;
      color: #F4F4F2;
      border-radius: 999px;
      padding: .4rem .9rem;
      cursor: pointer;
      display: inline-flex;
      gap: .4rem;
      align-items: center
    }

    .to-top:hover {
      border-color: #FF6A13;
      color: #FF6A13
    }

    .to-top .ico {
      width: 15px;
      height: 15px;
      transform: rotate(-90deg)
    }

    /* view transitions */
    ::view-transition-old(root) {
      animation: vtOut .35s var(--ease-io) both
    }

    ::view-transition-new(root) {
      animation: vtIn .55s var(--ease) both
    }

    @keyframes vtOut {
      to {
        opacity: 0;
        transform: translateY(-12px)
      }
    }

    @keyframes vtIn {
      from {
        opacity: 0;
        transform: translateY(16px)
      }
    }

    html.theme-vt::view-transition-old(root) {
      animation: none
    }

    html.theme-vt::view-transition-new(root) {
      animation: clipIn .8s var(--ease-io) both
    }

    @keyframes clipIn {
      from {
        clip-path: circle(0 at var(--cx) var(--cy))
      }

      to {
        clip-path: circle(150vmax at var(--cx) var(--cy))
      }
    }

    .view-in {
      animation: fadeUp .6s var(--ease) both
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important
      }

      [data-r] {
        opacity: 1;
        transform: none
      }

      .marquee-in {
        animation: none
      }

      .truck.run {
        animation: none;
        transform: translateX(420px)
      }
    }
  </style>
</head>

  <header class="hdr">
    <div class="wrap">
      <a class="brand" href="#accueil" aria-label="Faya Yolla LENO"><span class="logo">FYL</span><span>F. Y.
          Leno</span></a>
      <ul class="nav" id="nav"></ul>
      <div class="tools-h">
        <div class="seg" id="seg" role="group"><span class="pill" aria-hidden="true"></span><button type="button"
            data-l="fr">FR</button><button type="button" data-l="en">EN</button></div>
        <button class="theme-btn" id="themeBtn" type="button"><svg class="ico sun" viewBox="0 0 24 24"
            aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg><svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
          </svg></button>
        <a class="btn btn-dark hdr-cta" id="hdrCta" href="#contact">Me contacter</a>
        <button class="burger" id="burger" type="button" aria-expanded="false"
